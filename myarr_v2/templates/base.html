<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Myarra{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#c0a878">
</head>
<body>
  <nav>
    <a href="/">Dashboard</a> | <a href="/reconciliation">Reconciliation</a> | <a href="/changeover">Changeover</a> | <a href="/pdca">PDCA</a> | <a href="/maintenance">Maintenance</a> | <a href="/herbie">Herbie</a> | <a href="/admin">Admin</a> | <a href="/setup">Setup</a>
  </nav>
  <br>
  {% block content %}{% endblock %}
  <footer>Myarra is the measure. Most plants work hard. Few close the loop.</footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/static/sw.js').catch(function(e) {
          console.log('SW registration failed:', e);
        });
      });
    }
  </script>
</body>
</html>
